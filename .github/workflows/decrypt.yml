name: Automated Spotify Update Fetcher
on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at midnight UTC
  workflow_dispatch: # Keeps the manual "Run" button active just in case

jobs:
  check-and-download:
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check_version.outputs.exists }}
      store_version: ${{ steps.check_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon requests

      - name: Check App Store vs GitHub Releases
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import requests
          import os
          import json

          # 1. Get current Spotify version from US App Store
          res = requests.get("https://itunes.apple.com/lookup?id=324684580").json()
          current_version = res['results'][0]['version']
          print(f"Latest App Store Version: {current_version}")

          # 2. Check if this version exists as a release tag in your repo
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {"Authorization": f"token {os.environ['GITHUB_TOKEN']}"}
          url = f"https://api.github.com/repos/{repo}/releases/tags/v{current_version}"
          
          release_res = requests.get(url, headers=headers)
          
          # Write outputs for GitHub actions steps to read
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={current_version}\n")
              if release_res.status_code == 200:
                  print("This version has already been downloaded and released. Skipping workflow.")
                  f.write("exists=true\n")
              else:
                  print("New update detected! Proceeding to download.")
                  f.write("exists=false\n")
          EOF

      - name: Execute Telegram Script
        if: steps.check_version.outputs.exists == 'false'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python main.py

      # Temporarily buffer the raw file between jobs
      - name: Pass to upload job
        if: steps.check_version.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          path: "*.ipa"
          retention-days: 1

  upload-and-release:
    needs: check-and-download
    if: needs.check-and-download.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission allowing GitHub to publish a release
    steps:
      - name: Download temporary file
        uses: actions/download-artifact@v8

      - name: Create Permanent Public Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.check-and-download.outputs.store_version }}"
          name: "Spotify v${{ needs.check-and-download.outputs.store_version }} (Decrypted)"
          body: "Automated extraction via @FastDecryptBot."
          files: "**/*.ipa"
          generate_release_notes: false
