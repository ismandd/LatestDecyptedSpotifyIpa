name: Automated Spotify Update Fetcher

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-and-download:
    runs-on: ubuntu-latest
    outputs:
      downloaded_count: ${{ steps.run_script.outputs.downloaded_count }}
      actual_version: ${{ steps.run_script.outputs.actual_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install telethon requests beautifulsoup4 lxml

          elif [ "$IPA_COUNT" -lt 1 ]; then
      - name: Cleanup old IPA files
        run: rm -f *.ipa

      - name: Execute Telegram Decryption Script
        id: run_script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Verify IPA files exist
        if: steps.run_script.outputs.downloaded_count != '0' && steps.run_script.outputs.downloaded_count != ''
        run: |
          IPA_COUNT=$(find . -maxdepth 1 -name "*.ipa" | wc -l)
          echo "Found $IPA_COUNT IPA files."
          if [ "$IPA_COUNT" -lt 1 ]; then
            echo "❌ Expected at least 1 IPA file."
            exit 1
          fi

      - name: Show downloaded IPA files
        if: steps.run_script.outputs.downloaded_count != '0' && steps.run_script.outputs.downloaded_count != ''
        run: ls -lh *.ipa

      - name: Upload IPA artifacts
        if: steps.run_script.outputs.downloaded_count != '0' && steps.run_script.outputs.downloaded_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: spotify-decrypted-ipas
          path: "*.ipa"
          retention-days: 1

  upload-and-release:
    needs: check-and-download
    if: needs.check-and-download.outputs.downloaded_count != '0' && needs.check-and-download.outputs.downloaded_count != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download IPA artifacts
        uses: actions/download-artifact@v4
        with:
          name: spotify-decrypted-ipas

      - name: Show files before release
        run: find . -type f -name "*.ipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-and-download.outputs.actual_version }}"
          name: "Spotify v${{ needs.check-and-download.outputs.actual_version }} (Decrypted)"
          body: |
            Automated Spotify decrypted IPA release.

            Sources:
            - @FastDecryptBot
            - @eeveedecrypterbot

            Original filenames preserved automatically.
          files: "**/*.ipa"
          generate_release_notes: false
