name: Automated Spotify Update Fetcher
on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every single day at midnight UTC
  workflow_dispatch: # Keeps your manual "Run workflow" button active

jobs:
  check-and-download:
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check_version.outputs.exists }}
      store_version: ${{ steps.check_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Selenium Tracker
        run: pip install telethon requests selenium

      - name: Execute Headless Chrome and Read JS State
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import os
          import sys
          import time
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          # 1. Configure a headless, stealthy Chrome browser environment
          chrome_options = Options()
          chrome_options.add_argument("--headless=new")
          chrome_options.add_argument("--no-sandbox")
          chrome_options.add_argument("--disable-dev-shm-usage")
          chrome_options.add_argument("user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36")
          
          driver = webdriver.Chrome(options=chrome_options)
          url = "https://apps.apple.com/us/app/spotify-music-and-podcasts/id324684580"
          
          current_version = None
          try:
              driver.get(url)
              
              # 2. Let the page execute JS scripts and wait explicitly for the version element to render
              # This looks for the visual 'whats-new__latest__version' element generated by JavaScript
              wait = WebDriverWait(driver, 15)
              element = wait.until(EC.presence_of_element_located((By.CLASS_NAME, "whats-new__latest__version")))
              
              # Extract text (e.g., "Version 9.1.48") and strip it down to numbers
              raw_text = element.text
              print(f"Raw rendered text found on page: '{raw_text}'")
              
              # Extract just the digits and decimals (e.g., 9.1.48)
              import re
              version_match = re.search(r'([0-9.]+)', raw_text)
              if version_match:
                  current_version = version_match.group(1).strip()
                  
          except Exception as e:
              print(f"Selenium execution alert: {e}")
              
              # EMERGENCY DIAGNOSIS: Capture DOM state and take a real PNG screenshot
              print("Saving layout states for error triage tracking...")
              try:
                  with open("appstore_rendered_dump.html", "w", encoding="utf-8") as f:
                      f.write(driver.page_source)
                  driver.save_screenshot("browser_view.png")
              except:
                  pass
                  
          finally:
              driver.quit()

          # 3. Handle processing outcome
          if not current_version:
              print("❌ Critical Error: Unable to render version elements using headless engine.")
              sys.exit(1)

          print(f"✅ Success! Live Rendered App Store Version Found: {current_version}")

          # 4. Check if your repository already has a release tag for this version
          repo = os.environ['GITHUB_REPOSITORY']
          gh_headers = {"Authorization": f"token {os.environ['GITHUB_TOKEN']}"}
          tag_url = f"https://api.github.com/repos/{repo}/releases/tags/v{current_version}"
          
          release_res = requests.get(tag_url, headers=gh_headers)
          
          # Pass indicators down to workflow steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={current_version}\n")
              if release_res.status_code == 200:
                  print(f"Version v{current_version} already has a public release. Terminating pipeline.")
                  f.write("exists=true\n")
              else:
                  print(f"New update detected (v{current_version})! Initializing download pipeline.")
                  f.write("exists=false\n")
          EOF

      # If Selenium can't find it, upload what the browser saw
      - name: Upload Browser View Logs On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-browser-debug
          path: |
            appstore_rendered_dump.html
            browser_view.png
          retention-days: 7

      - name: Execute Telegram Decryption Script
        if: steps.check_version.outputs.exists == 'false'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python main.py

      # Temporarily buffer the raw file between jobs safely
      - name: Pass to upload job
        if: steps.check_version.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: raw-ipa-buffer
          path: "*.ipa"
          retention-days: 1

  upload-and-release:
    needs: check-and-download
    if: needs.check-and-download.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download temporary buffered file
        uses: actions/download-artifact@v4
        with:
          name: raw-ipa-buffer

      - name: Create Permanent Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-and-download.outputs.store_version }}"
          name: "Spotify v${{ needs.check-and-download.outputs.store_version }} (Decrypted)"
          body: "Automated extraction via @FastDecryptBot."
          files: "**/*.ipa"
          generate_release_notes: false
