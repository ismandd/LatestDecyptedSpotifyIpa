name: Automated Spotify Update Fetcher

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-download:
    runs-on: ubuntu-latest

    outputs:
      release_exists: ${{ steps.check_version.outputs.exists }}
      store_version: ${{ steps.check_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install telethon requests beautifulsoup4 lxml

      - name: Fetch Live Version From App Store
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python check_version.py

      # ----------------------------------------
      # FASTDECRYPTBOT
      # ----------------------------------------

      - name: Download IPA From FastDecryptBot
        if: steps.check_version.outputs.exists == 'false'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python fastdecrypt.py

      # ----------------------------------------
      # EEVEEDECRYPTERBOT
      # ----------------------------------------

      - name: Download IPA From EeveeDecrypterBot
        if: steps.check_version.outputs.exists == 'false'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python eevee.py

      # ----------------------------------------
      # VERIFY IPA FILES
      # ----------------------------------------

      - name: Verify Downloaded Files
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "Downloaded IPA files:"
          ls -lah *.ipa

          COUNT=$(ls -1 *.ipa 2>/dev/null | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No IPA files downloaded."
            exit 1
          fi

      # ----------------------------------------
      # UPLOAD ARTIFACT
      # ----------------------------------------

      - name: Upload IPA Artifact Buffer
        if: steps.check_version.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: raw-ipa-buffer
          path: "*.ipa"
          retention-days: 1

  upload-and-release:
    needs: check-and-download

    if: needs.check-and-download.outputs.release_exists == 'false'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Buffered Files
        uses: actions/download-artifact@v4
        with:
          name: raw-ipa-buffer

      - name: Show Files
        run: ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-and-download.outputs.store_version }}"
          name: "Spotify v${{ needs.check-and-download.outputs.store_version }} (Decrypted)"
          body: |
            Automated decryption release.

            Sources:
            - @FastDecryptBot
            - @eeveeDecrypterBot

          files: |
            *.ipa

          generate_release_notes: false
