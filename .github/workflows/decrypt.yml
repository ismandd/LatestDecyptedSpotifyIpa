name: Automated Spotify Update Fetcher
on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every single day at midnight UTC
  workflow_dispatch: # Keeps your manual "Run workflow" button active

jobs:
  check-and-download:
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check_version.outputs.exists }}
      store_version: ${{ steps.check_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon requests

      - name: Check Live App Store Stream vs GitHub Releases
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import requests
          import re
          import os
          import sys

          # 1. Query the live Apple RSS feed system for the US App Store
          url = "https://itunes.apple.com/us/rss/customerreviews/id=324684580/json"
          try:
              data = requests.get(url, timeout=15).json()
              # Dig straight into the first entry element which targets the latest app definition metadata
              feed_entries = data.get('feed', {}).get('entry', [])
              
              if not feed_entries:
                  print("Could not parse entry array from feed, trying fallback parsing...")
                  # Backup check: pulling raw page cleanly
                  page_url = "https://apps.apple.com/us/app/spotify-music-and-podcasts/id324684580"
                  html = requests.get(page_url, headers={"User-Agent": "Mozilla/5.0"}).text
                  v_match = re.search(r'\"version\"\s*:\s*\"([0-9.]+)\"', html)
                  current_version = v_match.group(1) if v_match else None
              else:
                  # The application metadata block is assigned to index 0 inside the entries array
                  current_version = feed_entries[0].get('im:version', {}).get('label', '').strip()
          
          except Exception as e:
              print(f"Connection failure to feed tracking servers: {e}")
              sys.exit(1)

          if not current_version:
              print("Critical Error: Failed to isolate target version number from Apple infrastructure.")
              sys.exit(1)

          print(f"Live App Store Version Found: {current_version}")

          # 2. Check if your repository already has a release tag for this version
          repo = os.environ['GITHUB_REPOSITORY']
          gh_headers = {"Authorization": f"token {os.environ['GITHUB_TOKEN']}"}
          tag_url = f"https://api.github.com/repos/{repo}/releases/tags/v{current_version}"
          
          release_res = requests.get(tag_url, headers=gh_headers)
          
          # Pass indicators down to workflow steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={current_version}\n")
              if release_res.status_code == 200:
                  print(f"Version v{current_version} already has a public release. Terminating pipeline.")
                  f.write("exists=true\n")
              else:
                  print(f"New update detected (v{current_version})! Initializing download pipeline.")
                  f.write("exists=false\n")
          EOF

      - name: Execute Telegram Decryption Script
        if: steps.check_version.outputs.exists == 'false'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python main.py

      # Temporarily buffer the raw file between jobs safely
      - name: Pass to upload job
        if: steps.check_version.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: raw-ipa-buffer
          path: "*.ipa"
          retention-days: 1

  upload-and-release:
    needs: check-and-download
    if: needs.check-and-download.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants GitHub permission to generate releases and attach assets
    steps:
      - name: Download temporary buffered file
        uses: actions/download-artifact@v4
        with:
          name: raw-ipa-buffer

      - name: Create Permanent Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-and-download.outputs.store_version }}"
          name: "Spotify v${{ needs.check-and-download.outputs.store_version }} (Decrypted)"
          body: "Automated extraction via @FastDecryptBot."
          files: "**/*.ipa"
          generate_release_notes: false
